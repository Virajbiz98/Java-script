<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindful Bot</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Define a custom dark theme for a more attractive look */
        body {
            font-family: 'Inter', sans-serif;
            background: #111827; /* Dark charcoal */
            background-size: 400% 400%;
            animation: gradient-animation 15s ease infinite;
        }

        /* Subtle gradient animation for the body background */
        @keyframes gradient-animation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* Styling for user and bot chat bubbles */
        .chat-bubble-user {
            background-color: #3b82f6; /* A vibrant blue */
            color: white;
            border-bottom-right-radius: 1.5rem;
            border-bottom-left-radius: 1.5rem;
            border-top-left-radius: 1.5rem;
        }
        .chat-bubble-bot {
            background-color: #374151; /* A dark gray for contrast */
            color: #d1d5db; /* Light gray text */
            border-bottom-right-radius: 1.5rem;
            border-bottom-left-radius: 1.5rem;
            border-top-right-radius: 1.5rem;
        }

        /* Loading animation dots */
        .dot {
            width: 8px;
            height: 8px;
            background-color: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot-2 {
            animation-delay: -0.32s;
        }
        .dot-3 {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1.0);
            }
        }

    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div id="chat-container" class="bg-gray-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-w-xl w-full h-[85vh] transition-all duration-500 transform hover:scale-105">
        <header class="bg-gray-900 text-white p-6 flex items-center justify-between border-b border-gray-700 shadow-md">
            <h1 class="text-2xl font-bold">Mindful Bot</h1>
        </header>

        <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-6">
            <div class="flex items-start">
                <div class="p-4 rounded-3xl chat-bubble-bot shadow-lg max-w-[85%] animate-fade-in">
                    <p>Hello! I'm here to listen and offer some support. Please remember, I'm an AI and not a substitute for professional medical advice. How are you feeling today?</p>
                </div>
            </div>
        </div>

        <div class="p-4 bg-gray-900 flex items-center shadow-inner border-t border-gray-700">
            <input type="text" id="user-input" class="flex-1 p-4 rounded-full border border-gray-600 bg-gray-800 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300" placeholder="Type your message...">
            <button id="send-button" class="ml-3 p-4 bg-blue-600 text-white rounded-full hover:bg-blue-500 transition-all duration-300 transform hover:scale-110 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Check if the __app_id variable is defined, otherwise use a default
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // Redirect logic to be triggered once
        let hasRedirected = false;
        const redirectLink = 'https://otieu.com/4/9660897';

        const handleRedirect = () => {
            if (!hasRedirected) {
                hasRedirected = true;
                window.open(redirectLink, '_blank');
            }
        };

        // Initialize event listeners after the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', () => {
            const chatContainer = document.getElementById('chat-container');
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');

            // Listen for clicks on the body, and redirect only if the click is outside the chat container
            document.body.addEventListener('click', (e) => {
                if (!chatContainer.contains(e.target)) {
                    handleRedirect();
                }
            });

            // The API key for the Gemini API. This is automatically handled by the Canvas environment.
            const apiKey = "AIzaSyA9kpz2LSTjqXC8Ih9I8qZElR74W6WkwZM";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
            
            // The system instruction for the bot's behavior
            const systemInstruction = "You are a supportive and empathetic chatbot designed to help with mental health. Provide compassionate, non-judgmental, and general advice. Always remind the user that you are not a professional therapist or doctor and that they should seek professional help for serious concerns. Use a friendly and warm tone.";

            // Function to add a new message to the chat
            const addMessage = (text, sender) => {
                const messageContainer = document.createElement('div');
                messageContainer.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
                
                const messageBubble = document.createElement('div');
                messageBubble.className = `p-4 rounded-3xl shadow-lg max-w-[85%] animate-fade-in ${sender === 'user' ? 'chat-bubble-user' : 'chat-bubble-bot'}`;
                messageBubble.innerHTML = `<p>${text}</p>`;
                
                messageContainer.appendChild(messageBubble);
                chatMessages.appendChild(messageContainer);
                chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll to the bottom
            };

            // Function to add a loading indicator (typing dots)
            const addLoadingIndicator = () => {
                const loadingBubble = document.createElement('div');
                loadingBubble.id = 'loading-indicator';
                loadingBubble.className = 'flex items-center space-x-2';
                loadingBubble.innerHTML = `
                    <div class="p-4 rounded-3xl shadow-lg chat-bubble-bot">
                        <div class="flex space-x-2">
                            <div class="dot dot-1"></div>
                            <div class="dot dot-2"></div>
                            <div class="dot dot-3"></div>
                        </div>
                    </div>
                `;
                chatMessages.appendChild(loadingBubble);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };

            // Function to remove the loading indicator
            const removeLoadingIndicator = () => {
                const indicator = document.getElementById('loading-indicator');
                if (indicator) indicator.remove();
            };

            // Main function to handle sending a message
            const sendMessage = async () => {
                const message = userInput.value.trim();
                if (!message) return;

                addMessage(message, 'user');
                userInput.value = '';
                addLoadingIndicator();

                try {
                    const chatHistory = [
                        { role: "user", parts: [{ text: systemInstruction }] },
                        { role: "user", parts: [{ text: message }] }
                    ];

                    const payload = {
                        contents: chatHistory,
                        generationConfig: {
                            maxOutputTokens: 1024,
                            temperature: 0.9,
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`API responded with status: ${response.status}`);
                    }

                    const result = await response.json();

                    if (
                        result.candidates &&
                        result.candidates[0].content &&
                        result.candidates[0].content.parts &&
                        result.candidates[0].content.parts.length > 0
                    ) {
                        const botResponse = result.candidates[0].content.parts[0].text;
                        removeLoadingIndicator();
                        addMessage(botResponse, 'bot');
                    } else {
                        throw new Error('Unexpected API response structure.');
                    }
                } catch (error) {
                    removeLoadingIndicator();
                    console.error('Error fetching response:', error);
                    addMessage("I'm sorry, I encountered an error. Please try again.", 'bot');
                }
            };

            sendButton.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
        });
    </script>
</body>
</html>
